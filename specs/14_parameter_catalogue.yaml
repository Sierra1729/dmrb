  non_co2_to_co2_ratio: {value: 0.07, source: "Eq.3, 4, 8 (IPCC 2006 Table 2.5 adapted)"}
  CF_TREE: {value: 0.50, source: "Eq.3, 4"}
  CF_SHRUB: {value: 0.50, source: "Eq.3"}
  BDR_SF: {value: 0.10, source: "Eq.3, DPT"}
  f_BL: {tropical: 0.25, temperate: 0.10, source: "Eq.4"}
  BEF2_harvest: {value: 1.25, source: "Eq.5"}
  fire_area_threshold_fraction_of_project: {value: 0.05, source: "para 4"}
  COMF:
    tropical: [{age_min: 3, age_max: 5, value: 0.46}, {age_min: 6, age_max: 10, value: 0.67},
               {age_min: 11, age_max: 17, value: 0.50}, {age_min: 18, age_max: .inf, value: 0.32}]
    boreal: 0.40
    temperate: 0.45
    note: "Tropical age < 3 years not tabulated: require project-specific value"
  EF_CH4_g_per_kg_dm: {tropical: 6.8, other: 4.7}
  EF_N2O_g_per_kg_dm: {tropical: 0.20, other: 0.26}

