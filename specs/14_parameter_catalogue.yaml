BM-T-011:
  phi_default:
    project_or_leakage: 1.0
    baseline: {A: {humid_wet: 0.75, dry: 0.75}, B: {humid_wet: 0.85, dry: 0.80}}
  OX: 0.1
  F: 0.5
  DOC_f_default: 0.5
  MCF_default: {anaerobic_managed: 1.0, semi_aerobic_managed: 0.5, unmanaged_deep_ge_5m: 0.8, unmanaged_shallow_or_stockpile: 0.4}
  stockpile_volume_to_area_min: 1.5
  waste_density_t_m3: {min: 1.0, max: 1.2, source: "para 22 (Application A)"}
  uncertainty_factors_pct:   # Table 3: [low, high]
    a_W: [2, 10]
    b_DOCj: [5, 10]
    c_DOCf: [5, 15]
    d_F: [0, 5]
    e_MCF: [0, 50]
    g_exp: [5, 20]
  DOC_j_pct_wet:
    wood: 43
    paper_cardboard: 40
    food: 15
    textiles: 24
    garden_park: 20
    inert: 0
    efb: 20
    industrial_sludge: {default: 9, formula: "9 * ODM_pct / 35"}
    domestic_sludge: {default: 5, formula: "5 * ODM_pct / 10"}
  k_per_yr:   # Table DPT 7: [boreal_temperate_dry, boreal_temperate_wet, tropical_dry, tropical_wet]
    paper_cardboard_textiles: [0.04, 0.06, 0.045, 0.07]
    wood_straw:               [0.02, 0.03, 0.025, 0.035]
    garden_park_nonfood:      [0.05, 0.10, 0.065, 0.17]
    food_sewage_sludge:       [0.06, 0.185, 0.085, 0.40]
    efb: "= garden_park_nonfood"
    pulp_paper_sludge: 0.03
  climate_class_rules:
    boreal_temperate: "MAT <= 20 C"
    tropical: "MAT > 20 C"
    dry_wet_boreal_temperate: "MAP/PET < 1 dry; MAP/PET > 1 wet"
    dry_wet_tropical: "MAP < 1000 mm dry; MAP > 1000 mm wet"
    boundary_rule: "exact boundary values -> class giving lower emissions (E-T11-04)"
  BMP_min_sample_g: 500
  BMP_min_tests: 3
  composition_samples_min: "3 every 3 months"

SOC_model_guidelines_DRAFT:
  safety_discount_pct: {A: 0, B: 10, C: 30, D: 50}
  min_distance_cal_val_m: 30
  cv_min_folds: 5
  cv_recommended_folds: 10
  cv_min_points_per_fold: 20
  cv_min_points_total: 100
  alpha: 0.10
  verification_max_interval_years: 5
  failure_remedy_days: 90

SOC_activity_tools_DRAFT:
  significance_threshold_pct: 5
  missing_se_default_fraction: 0.50
  missing_se_t_value: 3
  baseline_cap_without_records_fraction_of_project: 0.50
  EF_FE_as_printed_tCO2e_per_kgN: {value: 0.01, errata: E-SOCAT-01}
  EF1_IPCC2019_aggregated_kgN2O_N_per_kgN: 0.01
  N2O_N_to_N2O: 1.5714285714285714   # 44/28
  zero_tillage_yield_drop_leakage_threshold_pct: 5
