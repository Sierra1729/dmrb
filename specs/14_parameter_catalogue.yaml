# Parameter catalogue: default values transcribed from the source PDFs.
# Load into the engine's ParameterRegistry at startup. Each entry is immutable per version;
# changes require a new catalogue version and a migration note.
# Keys: tool, symbol, value, unit, source (doc + page/table/eq), notes, errata.

catalogue_version: "2026.10-01"
gwp_sets:
  AR6:            {CH4: 29.8, N2O: 273, source: "IPCC AR6 WG1 Table 7.15 (values used in BEE methodologies)"}
  SAR_as_printed: {CH4: 21,   N2O: 310, source: "BM-T-AR-0002 v1.0 Eq.7 parameter table", errata: E-GWP-01}
default_gwp_set: AR6

global:
  forest_threshold_crown_cover: {value: 0.30, unit: fraction, source: "BM-T-AR-0004 paras 26, 56", errata: E-AR4-08}
  proportionate_crown_cover_limit_factor: {value: 0.20, unit: fraction, source: "BM-T-AR-0004 paras 26, 55"}
  uncertainty_threshold_pct: {value: 10, source: "BM-T-AR-0004 paras 20, 24, 38, 48, 61"}
  confidence_level: {value: 0.90, source: "BM-T-AR-0004 section 2; SOC FM section 9"}
  C_to_CO2: {value: 3.6666666666666665, expr: "44/12"}
  CH4_C_to_CH4: {value: 1.3333333333333333, expr: "16/12"}

uncertainty_discount_table:   # BM-T-AR-0004 Appendix 2 Table 1 (PDF p.29)
  - {u_max_pct: 10,  discount_fraction_of_halfwidth: 0.00}
  - {u_max_pct: 15,  discount_fraction_of_halfwidth: 0.25}
  - {u_max_pct: 20,  discount_fraction_of_halfwidth: 0.50}
  - {u_max_pct: 30,  discount_fraction_of_halfwidth: 0.75}
  - {u_max_pct: .inf, discount_fraction_of_halfwidth: 1.00}

BM-T-AR-0004:
  CF_TREE: {value: 0.47, unit: "t C / t d.m.", source: "Eq.3, 10, 12, 21 variable lists"}
  CF_S:    {value: 0.47, unit: "t C / t d.m.", source: "Eq.26"}
  R_TREE_baseline: {value: 0.25, source: "Eq.10, 21"}
  R_S:     {value: 0.40, source: "Eq.26"}
  BDR_SF:  {value: 0.10, source: "Eq.27"}
  BEF2_ex_post: {value: 1.15, source: "Appendix 1 para 5"}
  root_shoot_formula: {expr: "exp(-1.085 + 0.9256*ln(b))/b", b: "AGB t d.m./ha", source: "Appendix 1 para 5"}
  shrub_cc_zero_below: {value: 0.05, source: "para 67", errata: E-AR4-06}
  shrub_cc_cyclic_baseline: {value: 0.5, source: "DPT 2 comment"}

BM-T-AR-0003:
  CF_TREE: {value: 0.5, unit: "t C / t d.m.", source: "DPT 2", errata: E-CF-01}
  CF_LI:   {value: 0.37, unit: "t C / t d.m.", source: "DPT 3, Eq.12"}
  alpha_dead_tree: {leaves_twigs_lost: 0.975, small_branches_lost: 0.80, source: "para 12"}
  beta_decay_class: {sound: 1.00, intermediate: 0.80, rotten: 0.45, source: "para 21"}
  ormerod: {coef: 0.57, exponent: 0.80, source: "Eq.4"}
  litter_factor: {value: 2.5, source: "Eq.12", note: "= 10 / n_frames with 4 frames"}
  transect_min_total_length_m: 100
  lying_deadwood_min_diameter_cm: 10
  DF_DW_pct:   # DPT 5
    - {biome: tropical, elevation: "<2000", precip: "<1000", value: 2}
    - {biome: tropical, elevation: "<2000", precip: "1000-1600", value: 1}
    - {biome: tropical, elevation: "<2000", precip: ">1600", value: 6}
    - {biome: tropical, elevation: ">2000", precip: all, value: 7}
    - {biome: temperate_boreal, elevation: all, precip: all, value: 8}
  DF_LI_pct:   # DPT 6
    - {biome: tropical, elevation: "<2000", precip: "<1000", value: 4}
    - {biome: tropical, elevation: "<2000", precip: "1000-1600", value: 1}
    - {biome: tropical, elevation: "<2000", precip: ">1600", value: 1}
    - {biome: tropical, elevation: ">2000", precip: all, value: 1}
    - {biome: temperate_boreal, elevation: all, precip: all, value: 4}

