[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dmrv"
version = "0.1.0"
description = "Digital MRV & Carbon Accounting Platform for the Indian Carbon Market (CCTS Offset Mechanism)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pint>=0.24",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyproj>=3.6",
    "shapely>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
dmrv = "cli.main:app"

[tool.setuptools.packages.find]
where = ["packages", "apps"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["dmrv_core.*"]
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "openpyxl.*", "docx.*", "pint.*", "yaml.*", "pyproj.*", "shapely.*", "argon2.*", "jwt.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM"]
ignore = ["B008", "A003", "A005", "N815", "E501", "B904", "SIM118"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps", "."]
addopts = "-v --cov=packages/dmrv_core --cov-report=term-missing"
